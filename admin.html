<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Заявки песен на дискотеку</title>
<style>
:root{--bg:#231a4f;--card:#2f2566;--line:#4a3d8f;--txt:#fff6e8;--dim:#b9b0e0;--acc:#ffb347;--pink:#ff5c8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;padding:20px 16px 60px}
main{max-width:900px;margin:0 auto}
h1{margin:0 0 14px;font-size:1.8rem}
input{background:var(--bg);color:var(--txt);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;width:100%;margin-bottom:10px}
button{font:inherit;cursor:pointer;color:var(--txt)}
button:focus-visible,input:focus{outline:3px solid var(--acc);outline-offset:1px}
.login{max-width:340px}
.login button{background:var(--pink);border:0;border-radius:10px;padding:10px 18px;font-weight:bold}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.bar button{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:6px 14px}
.bar button.on{border-color:var(--acc);color:var(--acc)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border-radius:14px;padding:14px;border-left:6px solid var(--line);cursor:pointer;text-align:left}
.card[data-s=ok]{border-left-color:#5be08a}.card[data-s=no]{border-left-color:var(--pink)}.card[data-s=maybe]{border-left-color:var(--acc)}
.card .d{color:var(--dim);font-size:.85rem}
.card .p{margin:6px 0 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.mark{float:right;font-size:1.3rem}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
#modal.show{display:flex}
.sheet{background:var(--card);border-radius:16px;padding:20px;max-width:620px;width:100%}
.sheet h2{margin:0 0 4px}
.note{background:var(--bg);border-radius:10px;padding:10px 12px;white-space:pre-wrap;margin:10px 0}
.s{border-top:1px solid var(--line);padding:10px 0}
.s audio{width:100%;margin-top:6px}
.st{display:flex;gap:8px;margin-top:14px}
.st button{flex:1;font-size:1.6rem;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px}
.st button.on{border-color:var(--acc);background:#4a3d8f}
.x{background:none;border:0;color:var(--dim);float:right;font-size:1.6rem}
.del{background:none;border:0;color:var(--dim);margin-top:14px;text-decoration:underline;font-size:.85rem}
.empty{color:var(--dim)}
</style></head><body><main>
<h1>Заявки песен на дискотеку</h1>

<form class="login" id="login">
  <input id="em" type="email" placeholder="Почта" autocomplete="username" required>
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" required>
  <button>Войти</button> <span id="lerr" style="color:#ff9aa8"></span>
</form>

<div id="app" hidden>
  <div class="bar" id="bar"></div>
  <div id="list"></div>
</div>

<div id="modal"><div class="sheet" id="sheet"></div></div>
</main>
<script>
// ТЕ ЖЕ ДАННЫЕ, ЧТО В index.html
const SB = "https://roolbmnfwenhkajgmvrh.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvb2xibW5md2VuaGthamdtdnJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5Mjg1NDEsImV4cCI6MjA4OTUwNDU0MX0.Av0eE_b5gPaHhoitDaR9N4sdt5ne6dik3r5NMX07T6g";

let token = sessionStorage.getItem("tk"), rows = [], filter = "all";
const MARK = {ok:"✅", no:"❌", maybe:"❓"};
const FILTERS = [["all","Все"],["new","Не смотрел"],["ok","✅"],["no","❌"],["maybe","❓"],["5-7","5–7 класс"],["8-11","8–11 класс"]];
const match = (r,k) => k==="all" || (k==="new" ? !r.status : (k==="5-7"||k==="8-11") ? r.grade===k : r.status===k);
const GR = {"5-7":"5–7 кл.","8-11":"8–11 кл."};
const H = () => ({apikey:KEY, Authorization:"Bearer "+token, "Content-Type":"application/json"});
const $ = id => document.getElementById(id);
function el(tag, props, ...kids){ const e = document.createElement(tag); Object.assign(e, props||{}); kids.forEach(k => e.append(k)); return e; }

$("login").onsubmit = async ev => {
  ev.preventDefault();
  const r = await fetch(SB+"/auth/v1/token?grant_type=password", {method:"POST",
    headers:{apikey:KEY,"Content-Type":"application/json"}, body:JSON.stringify({email:$("em").value, password:$("pw").value})});
  if(!r.ok){ $("lerr").textContent = "Неверная почта или пароль"; return; }
  token = (await r.json()).access_token; sessionStorage.setItem("tk", token); start();
};

async function load(){
  const r = await fetch(SB+"/rest/v1/requests?select=*&order=created_at.desc", {headers:H()});
  if(!r.ok){ sessionStorage.removeItem("tk"); token = null; $("app").hidden = true; $("login").hidden = false; return; }
  rows = await r.json(); draw();
}
function start(){ $("login").hidden = true; $("app").hidden = false; load(); }

function draw(){
  const bar = $("bar"); bar.innerHTML = "";
  FILTERS.forEach(([k,t]) => {
    const n = rows.filter(r => match(r,k)).length;
    const b = el("button", {textContent: t+" "+n, className: filter===k ? "on" : ""}); b.onclick = () => { filter = k; draw(); }; bar.append(b);
  });
  bar.append(el("button", {textContent:"Обновить", onclick:load}));
  const list = $("list"); list.innerHTML = "";
  const shown = rows.filter(r => match(r,filter));
  if(!shown.length){ list.append(el("p", {className:"empty", textContent:"Здесь пока пусто."})); return; }
  shown.forEach(r => {
    const c = el("button", {className:"card"}); c.dataset.s = r.status || "";
    const first = (r.songs||[])[0];
    c.append(el("span", {className:"mark", textContent: MARK[r.status] || ""}),
      el("div", {className:"d", textContent: (GR[r.grade] ? GR[r.grade]+" · " : "")+new Date(r.created_at).toLocaleString("ru-RU")+" · песен: "+(r.songs||[]).length+((r.banned||[]).length ? " · не ставить: "+r.banned.length : "")}),
      el("div", {className:"p", textContent: r.note || (first ? [first.title, first.author].filter(Boolean).join(" — ") : "(без текста)")}));
    c.onclick = () => open(r); list.append(c);
  });
}

function open(r){
  const s = $("sheet"); s.innerHTML = "";
  const x = el("button", {className:"x", textContent:"×"}); x.onclick = close;
  s.append(x, el("h2", {textContent:"Заявка"+(GR[r.grade] ? " · "+GR[r.grade] : "")}), el("div", {className:"d", style:"color:#b9b0e0", textContent:new Date(r.created_at).toLocaleString("ru-RU")}));
  if(r.note) s.append(el("div", {className:"note", textContent:r.note}));
  (r.songs||[]).forEach(g => {
    const d = el("div", {className:"s"}, el("b", {textContent:[g.title, g.author].filter(Boolean).join(" — ") || "(без названия)"}));
    if(g.when) d.append(el("span", {textContent:" · "+g.when, style:"color:#ffb347;font-weight:bold"}));
    if(g.url){ d.append(el("audio", {controls:true, preload:"none", src:g.url}), el("a", {href:g.url, download:g.filename||"", textContent:"  Скачать "+(g.filename||""), style:"color:#ffb347;font-size:.85rem"})); }
    s.append(d);
  });
  if((r.banned||[]).length){
    s.append(el("h3", {textContent:"Не ставить", style:"margin:16px 0 4px;color:#ff9aa8"}));
    r.banned.forEach(g => s.append(el("div", {className:"s", textContent:[g.title, g.author].filter(Boolean).join(" — ")})));
  }
  const st = el("div", {className:"st"});
  Object.entries(MARK).forEach(([k,m]) => {
    const b = el("button", {textContent:m, className: r.status===k ? "on" : ""});
    b.onclick = async () => { const v = r.status===k ? null : k; await patch(r, {status:v}); open(r); };
    st.append(b);
  });
  const del = el("button", {className:"del", textContent:"Удалить заявку"});
  del.onclick = async () => { if(!confirm("Удалить насовсем?")) return;
    await fetch(SB+"/rest/v1/requests?id=eq."+r.id, {method:"DELETE", headers:H()}); rows = rows.filter(z => z!==r); close(); draw(); };
  s.append(st, del); $("modal").classList.add("show");
}
async function patch(r, body){
  const res = await fetch(SB+"/rest/v1/requests?id=eq."+r.id, {method:"PATCH", headers:{...H(), Prefer:"return=minimal"}, body:JSON.stringify(body)});
  if(res.ok) Object.assign(r, body); draw();
}
function close(){ $("modal").classList.remove("show"); }
$("modal").onclick = e => { if(e.target.id==="modal") close(); };
addEventListener("keydown", e => { if(e.key==="Escape") close(); });
if(token) start();
</script></body></html>
